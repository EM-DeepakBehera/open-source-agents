<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Shield</title>
<meta name="description" content="Check if a message is a scam. Works offline, on any phone, in 8 Indian languages.">
<meta name="theme-color" content="#0b57d0">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<style>
:root{--bg:#f7f9fc;--card:#fff;--text:#111;--muted:#444;--border:#8a8f98;--primary:#0b57d0;--on-primary:#fff;
--scam:#b3261e;--scam-bg:#fde7e6;--sus:#7a4f00;--sus-bg:#fff4d6;--safe:#146c2e;--safe-bg:#e3f6e8;--focus:#ff8c00}
@media (prefers-color-scheme:dark){:root:not([data-contrast=high]){--bg:#111418;--card:#1c2026;--text:#f1f3f6;--muted:#c4c7cc;
--border:#8a8f98;--primary:#a8c7fa;--on-primary:#062e6f;--scam:#ffb4ab;--scam-bg:#410e0b;--sus:#ffd47a;--sus-bg:#3a2a00;
--safe:#8fd9a0;--safe-bg:#0e2e17}}
:root[data-contrast=high]{--bg:#000;--card:#000;--text:#fff;--muted:#fff;--border:#fff;--primary:#ff0;--on-primary:#000;
--scam:#fff;--scam-bg:#000;--sus:#fff;--sus-bg:#000;--safe:#fff;--safe-bg:#000;--focus:#0ff}
:root[data-large=on]{font-size:125%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0 0}
.tag{color:var(--muted);margin:.2em 0 1em}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
label{font-weight:600;display:block;margin-bottom:6px}
textarea,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--border);border-radius:10px;padding:12px}
textarea{min-height:8rem;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
button,.btn{min-height:48px;min-width:48px;font:inherit;font-weight:600;border-radius:10px;border:2px solid var(--primary);
background:transparent;color:var(--text);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.row>button,.row>.btn{flex:1 1 140px}
button.primary{background:var(--primary);color:var(--on-primary);width:100%;font-size:1.15rem;margin-top:12px}
button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
:focus-visible,label.btn:has(+input:focus-visible){outline:4px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;color:var(--text)}.skip:focus{left:16px;top:8px;background:var(--card);padding:12px;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.result{border-width:3px}
.result.scam{background:var(--scam-bg);border-color:var(--scam);color:var(--scam)}
.result.suspicious{background:var(--sus-bg);border-color:var(--sus);color:var(--sus)}
.result.safe{background:var(--safe-bg);border-color:var(--safe);color:var(--safe)}
.result h2{margin:0;font-size:1.5rem}
.result p,.result li{color:var(--text)}
.meter{height:12px;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
.meter>span{display:block;height:100%;background:currentColor}
.note{font-size:.9rem;color:var(--muted)}
.help{border-color:var(--scam)}
.help a{color:var(--text);font-weight:700;display:inline-flex;align-items:center;min-height:48px}
details summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.toggles{display:grid;gap:8px}
#thumb{max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--border)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.busy::after{content:"";width:1em;height:1em;border:3px solid currentColor;
border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(1turn)}}}
@media (forced-colors:active){.meter>span{background:CanvasText}}
</style>
</head>
<body>
<a class="skip" href="#msg" data-i="skip">Skip to message box</a>
<main>
  <header>
    <h1><span aria-hidden="true">🛡️</span> <span data-i="title">Scam Shield</span></h1>
    <p class="tag" data-i="tagline">Not sure about a message? Check it before you click, pay or reply.</p>
  </header>

  <div class="card">
    <label for="lang" data-i="language">Language</label>
    <select id="lang">
      <option value="en">English</option><option value="hi">हिन्दी</option><option value="kn">ಕನ್ನಡ</option>
      <option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="ml">മലയാളം</option>
      <option value="mr">मराठी</option><option value="bn">বাংলা</option>
    </select>
    <details>
      <summary data-i="settings">Accessibility settings</summary>
      <div class="toggles">
        <button type="button" id="t-large" aria-pressed="false" data-i="large">Larger text</button>
        <button type="button" id="t-contrast" aria-pressed="false" data-i="contrast">High contrast</button>
        <button type="button" id="t-simple" aria-pressed="false" data-i="simple">Simple words</button>
        <button type="button" id="t-read" aria-pressed="false" data-i="autoread">Read result aloud automatically</button>
      </div>
    </details>
  </div>

  <form class="card" id="form">
    <label for="msg" data-i="label">Paste or speak the message</label>
    <textarea id="msg" data-i-ph="placeholder" placeholder="Example: Your SBI account will be blocked today. Update KYC at sbi-kyc.xyz"></textarea>
    <div class="row">
      <button type="button" id="mic"><span aria-hidden="true">🎤</span> <span data-i="speak">Speak</span></button>
      <label class="btn" for="photo" style="margin:0"><span aria-hidden="true">📷</span> <span data-i="photo">Screenshot</span></label>
      <input type="file" id="photo" accept="image/*" class="sr">
    </div>
    <div class="row" id="thumbrow" hidden>
      <img id="thumb" alt="">
      <button type="button" id="rmphoto" data-i="remove">Remove screenshot</button>
    </div>
    <button type="submit" class="primary" id="go"><span data-i="check">Check message</span></button>
  </form>

  <p id="status" class="note" role="status" aria-live="polite"></p>

  <section id="result" class="card result" hidden aria-labelledby="r-title">
    <h2 id="r-title" tabindex="-1"></h2>
    <div class="meter" aria-hidden="true"><span id="r-bar"></span></div>
    <p id="r-score"></p>
    <p id="r-summary"></p>
    <h3 data-i="flags">Warning signs</h3>
    <ul id="r-flags"></ul>
    <h3 data-i="advice">What to do</h3>
    <ul id="r-advice"></ul>
    <button type="button" id="speakbtn"><span aria-hidden="true">🔊</span> <span data-i="read">Read aloud</span></button>
    <p id="r-mode" class="note"></p>
  </section>

  <aside class="card help">
    <p><strong data-i="lost">Lost money to a scam?</strong> <span data-i="help">Call 1930 immediately or report at</span>
      <a href="https://cybercrime.gov.in" rel="noopener">cybercrime.gov.in</a></p>
  </aside>
</main>

  const asked=text.replace(NEGATED," ");
  for(const [k,w,re,skip] of RULES) if(re.test(ASKS.has(k)?asked:text)&&!(skip&&skip.test(text))){score+=w;flags.add(k)}
  if(NEWNUM.test(text)&&MONEYASK.test(text)){score+=40;flags.add("f_pay")}
  const urls=text.match(/https?:\/\/[^\s]+|(?<![@\w.-])(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/[^\s]*)?/gi)||[];
  for(const u of urls){
    let host;try{host=new URL(/^https?:/i.test(u)?u:"http://"+u).hostname.toLowerCase()}catch{continue}
    if(host.length<5)continue;
    const official=Object.values(BRANDS).flat().some(d=>host===d||host.endsWith("."+d));
    if(SHORT.test(host)||BADTLD.test(host)||/^\d+\.\d+\.\d+\.\d+$/.test(host)||host.includes("xn--")){score+=25;flags.add("f_link")}
    if(!official&&Object.keys(BRANDS).some(b=>host.split(/[.\-\d]/).some(l=>l===b||(b.length>=4&&l.includes(b))))){score+=45;flags.add("f_brand")}
  }
  if(flags.size>=2)score+=10;score=Math.min(score,100);
  const verdict=score>=60?"scam":score>=25?"suspicious":"safe";
  const advice=verdict==="scam"?["a_noclick","a_noshare","a_block","a_report"]:verdict==="suspicious"?["a_verify","a_noshare","a_noclick"]:["a_safe"];
  return {verdict,risk_score:score,red_flags:[...flags].map(t),advice:advice.map(t),mode:"offline"};
}

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let lang=store.get("lang")||(Object.keys(T).find(l=>(navigator.language||"").startsWith(l)))||"en";
let image=null,lastSpeech="",busy=false;
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;

function applyLang(){
  document.documentElement.lang=lang;$("lang").value=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll("[data-i-ph]").forEach(el=>el.placeholder=t(el.dataset.iPh));
  document.title=t("title");
}
function toggle(id,key,attr){
  const btn=$(id),apply=on=>{btn.setAttribute("aria-pressed",on);if(attr)document.documentElement.dataset[attr]=on?(attr==="contrast"?"high":"on"):""};
  apply(store.get(key)==="1");
  btn.onclick=()=>{const on=btn.getAttribute("aria-pressed")!=="true";apply(on);store.set(key,on?"1":"0")};
}
const on=id=>$(id).getAttribute("aria-pressed")==="true";
const status=msg=>{$("status").textContent=msg};

function render(r,note){
  const box=$("result"),v=["scam","suspicious","safe"].includes(r.verdict)?r.verdict:"suspicious";
  const icon={scam:"⛔",suspicious:"⚠️",safe:"✅"}[v];
  box.className="card result "+v;box.hidden=false;
  $("r-title").textContent=icon+" "+t(v)+(r.scam_type?" — "+r.scam_type:"");
  $("r-bar").style.width=(r.risk_score||0)+"%";
  $("r-score").textContent=t("risk")+": "+(r.risk_score||0)+"/100";
  $("r-summary").textContent=r.summary||"";$("r-summary").hidden=!r.summary;
  const fill=(ul,items)=>{ul.replaceChildren(...(items||[]).map(x=>{const li=document.createElement("li");li.textContent=x;return li}))};
  fill($("r-flags"),r.red_flags);fill($("r-advice"),r.advice);
  $("r-flags").previousElementSibling.hidden=!(r.red_flags||[]).length;
  $("r-mode").textContent=note||t(r.mode==="ai"?"ai":r.mode==="rules"?"rules":"offline")+(r.seconds?" · "+r.seconds+"s":"");
  lastSpeech=[t(v),r.summary,...(r.red_flags||[]).slice(0,3),...(r.advice||[])].filter(Boolean).join(". ");
  if(navigator.vibrate)navigator.vibrate({scam:[400,150,400,150,400],suspicious:[250,150,250],safe:[80]}[v]);
  if(on("t-read"))speak();
}
function speak(){
  if(!("speechSynthesis" in window)||!lastSpeech)return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastSpeech);u.lang=SPEECH[lang];
  const voice=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang));if(voice)u.voice=voice;
  u.rate=on("t-simple")?.85:1;speechSynthesis.speak(u);
}
async function compress(file){
  const bmp=await createImageBitmap(file),s=Math.min(1,1024/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.6);
}
async function check(){
  if(busy)return;const text=$("msg").value.trim();
  if(!text&&!image){status(t("empty"));$("msg").focus();return}
  busy=true;const go=$("go");go.classList.add("busy");go.setAttribute("aria-busy","true");status(t("checking"));
  if(text){render(offlineCheck(text),navigator.onLine?t("quick"):t("offline"));$("r-title").focus()}
  if(!navigator.onLine&&text){done();return}
  try{
    const res=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,image_base64:image,language:lang,simple:on("t-simple")})});
    if(!res.ok)throw new Error((await res.json().catch(()=>({}))).detail||res.status);
    const r=await res.json();
    if(r.mode==="rules"){const o=offlineCheck(text);r.red_flags=o.red_flags;r.advice=o.advice}
    render(r);$("r-title").focus();status("");
  }catch(e){if(text){render(offlineCheck(text),t("fail"));status(t("fail"))}else status(String(e.message||e))}
  done();
  function done(){busy=false;go.classList.remove("busy");go.removeAttribute("aria-busy")}
}

$("lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);applyLang()};
toggle("t-large","large","large");toggle("t-contrast","contrast","contrast");toggle("t-simple","simple");toggle("t-read","autoread");
$("form").onsubmit=e=>{e.preventDefault();check()};
$("speakbtn").onclick=speak;
$("photo").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{image=await compress(f);$("thumb").src=image;$("thumbrow").hidden=false;status(t("photook"))}catch{status(t("empty"))}
};
$("rmphoto").onclick=()=>{image=null;$("photo").value="";$("thumbrow").hidden=true};
$("mic").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status(t("nomic"));return}
  const r=new SR();r.lang=SPEECH[lang];r.interimResults=false;status(t("listening"));$("mic").setAttribute("aria-pressed","true");
  r.onresult=e=>{const m=$("msg");m.value=(m.value?m.value+" ":"")+e.results[0][0].transcript;status("")};
  r.onend=()=>$("mic").setAttribute("aria-pressed","false");r.onerror=()=>status(t("nomic"));r.start();
};
applyLang();
// Web Share Target: Android "Share -> Scam Shield" opens /?text=...
const q=new URLSearchParams(location.search),shared=[q.get("title"),q.get("text"),q.get("url")].filter(Boolean).join(" ");
if(shared){$("msg").value=shared;history.replaceState(null,"","/");check()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
